[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waze-voice-sdk"
version = "0.2.0"
description = "Windows-first toolkit for building custom navigation voice packs from your own audio."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["audio", "tts", "navigation", "voice", "ffmpeg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Sound/Audio :: Editors",
]

# The core pipeline is standard library only. ffmpeg is an external program and
# cannot be expressed here; `python scripts/wvs.py doctor` checks for it.
dependencies = []

[project.optional-dependencies]
clean = ["demucs>=4.0.1", "torch>=2.0", "torchaudio>=2.0"]
# Chatterbox is MIT licensed including its weights, and installs on current
# Python. It brings its own torch/torchaudio pins.
tts = ["chatterbox-tts>=0.1.7"]
# Optional alternative backend. XTTS-v2 weights are non-commercial; see
# docs/tts.md before relying on it.
tts-xtts = ["coqui-tts>=0.27.0"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
wvs = "waze_voice.cli:main"

[tool.setuptools.packages.find]
include = ["waze_voice*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# Every public function is annotated, so require it of new ones too. These
# caught three real things when first switched on: two functions returning Any
# through a float/bytes annotation, and a handler being passed None for a
# parameter typed as a config.
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
warn_redundant_casts = true
