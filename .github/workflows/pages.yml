name: Deploy site

# backseat.fm is served from site/ on GitHub Pages. The QR codes are generated
# here from site/voices.json rather than committed, so the UUIDs have exactly
# one home and a stale link is a one-line fix.

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate QR codes from voices.json
        run: |
          python -m pip install --disable-pip-version-check "segno>=1.6"
          python scripts/build_site.py

      - name: Every UUID on the site resolves
        run: python scripts/check_links.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
